[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mitre-gap-analyzer"
version = "0.1.0"
description = "MITRE ATT&CK Coverage Gap Analyzer"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Silvio Chessari", email = "chessarisilvio@gmail.com"}
]
keywords = ["mitre", "att&ck", "coverage", "gap", "analyzer", "cybersecurity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/chessarisilvio/mitre-att-ck-coverage-gap-analyzer"

[project.scripts]
mitre-gap-analyzer = "mitre_gap_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]